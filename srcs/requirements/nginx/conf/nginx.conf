user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    # Nginx a besoin de ce bloc même s'il est vide
}

http {
    include /etc/nginx/mime.types;
    
    server {
        # Configuration SSL/TLS
        listen 443 ssl;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;

        # Dossier racine et index
        root /var/www/html;
        server_name gematura.42.fr;
        index index.php index.html index.htm;
        
        # Gestion des requêtes PHP
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass wordpress:9000;
        }
        location ~ /\.ht {
            deny all;
        }
        location /cv/ {
            proxy_pass http://static_site:3000/;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /adminer/ {
            proxy_pass http://adminer:8080/;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 443 ssl;
        server_name kuma.gematura.42.fr; # Nouveau sous-domaine

        ssl_certificate /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;

        location / {
            proxy_pass http://uptime_kuma:3001;
            proxy_http_version 1.1;
            # Ces deux lignes sont obligatoires pour les WebSockets d'Uptime Kuma
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
}
}
