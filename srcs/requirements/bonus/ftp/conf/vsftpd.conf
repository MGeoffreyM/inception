listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES
chroot_local_user=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd

# Configuration du mode passif pour Docker
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=192.168.56.101
allow_writeable_chroot=YES
