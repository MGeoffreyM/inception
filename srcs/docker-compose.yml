services:
  mariadb:
    image: mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    restart: always
    env_file:
      - .env
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
    secrets:
      - db_password
      - root_db_password

  wordpress:
    image: wordpress
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
      - redis
    env_file:
      - .env
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    secrets:
      - db_password
      - root_wp_password
      - wp_password

  nginx:
    image: nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    depends_on:
      - wordpress
    restart: always
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html

  redis:
    image: redis
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    container_name: redis
    restart: always
    networks:
      - inception

  ftp:
    image: ftp
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
    container_name: ftp
    restart: always
    env_file:
      - .env
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    secrets:
      - ftp_password

  static_site:
    image: static_site
    build:
      context: ./requirements/bonus/static_site
      dockerfile: Dockerfile
    container_name: static_site
    restart: always
    networks:
      - inception

  adminer:
    image: adminer
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    container_name: adminer
    restart: always
    networks:
      - inception

  uptime_kuma:
    image: uptime_kuma
    build:
      context: ./requirements/bonus/uptime_kuma
      dockerfile: Dockerfile
    container_name: uptime_kuma
    restart: always
    networks:
      - inception
    volumes:
      - uptime_kuma_data:/var/www/data

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/gematura/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/gematura/data/html
  uptime_kuma_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/gematura/data/uptime_kuma

secrets:
  db_password:
    file: ../secrets/db_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
  root_db_password:
    file: ../secrets/root_db_password.txt
  root_wp_password:
    file: ../secrets/root_wp_password.txt
  wp_password:
    file: ../secrets/wp_password.txt
